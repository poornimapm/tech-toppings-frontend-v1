name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0' # git hooks are for local commits only

jobs:
  quality:
    name: lint · typecheck · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Missing translations (every text in en, ta and hi)
        run: npm run i18n:check

      - name: Unit tests (coverage gate in vite.config.ts)
        run: npm run test:coverage

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Production build
        run: npx vite build

      - name: Performance budget (first-load JavaScript, gzipped)
        run: npm run budget

      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Install Chromium (into node_modules)
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
